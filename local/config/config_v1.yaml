# ========================
# GENERAL SETUP
# ========================

TMPDIR: "/mnt/nvme_raid0/tmp"
CORES: 6
DOCKER_DATA_DIR: "/home"
RAW_DATA_DIR: "fastq"                             # Unified fastq location
OUTPUT_DIR: "/home/aleone/snakeRnaSeq/dataset/v1"  # Unified output location

# ========================
# EXPERIMENT INFO
# ========================

LAYOUT: "SINGLE"  # SINGLE | PAIRED 
STRANDED: "2"    # 0 -> unstranded, 1 -> forward, 2 -> reverse
FASTQ_FILTERING: "fastq"
aligner: "star"  # star | bwa
TRIMMER: "fastp"  # fastp | trim_galore

# ========================
# GENCODE & REFERENCE
# ========================

GENCODE:
  SPECIES: "hsapiens"      # hsapiens | mmusculus | mmusculus_hsapiens_combined
  VERSION: "29"            # 32 | M23
  GENOME: "GRCh38.primary_assembly" # GRCh38.primary_assembly | GRCm38.primary_assembly
  ASSEMBLY: "M29"
  ANNOTATION: "basic.annotation" # primary_assembly.annotation | basic.annotation

# ========================
# ALIGNMENT (STAR)
# ========================

STAR:
  VERSION: "2.7.11b"
  
  # Input / Output
  OUT_SAM_TYPE: "BAM SortedByCoordinate"
  readFilesCommand: "zcat"
  ADDITIONAL_OUTPUT: ""
  quantMode: "GeneCounts TranscriptomeSAM"
  # Alignment Filters
  OUT_FILTER_TYPE: "BySJout"
  OUT_FILTER_MULTIMAP_NMAX: 200           
  OUT_FILTER_MISMATCH_NMAX: 999           
  OUT_FILTER_MISMATCH_NOVER_LMAX: 0.04    
  MULTIMAP_SCORE_RANGE: 1
  # Alignment Splicing/Introns
  ALIGN_SJ_OVERHANG_MIN: 8                
  ALIGN_SJDB_OVERHANG_MIN: 1
  ALIGN_INTRON_MIN: 20
  ALIGN_INTRON_MAX: 1000000
  ALIGN_MATES_GAP_MAX: 1000000
  # Additional Parameters
  sjdbOverhang: 100
  limitSjdbInsertNsj: 1000000
  SAVE_UNMAPPED: "BAM" # BAM | FASTQ 
  INDEX:
    GRCh: "/home/reference_data/bioinfotree/task/gencode/dataset/hsapiens/46/GRCh38.p14.star_index/2.7.11b"
    CHM: "/home/reference_data/bioinfotree/task/gencode/dataset/hsapiens/T2T-CHM13v2.0/GCF_009914755.1_T2T-CHM13v2.0.star_index/2.7.11a"
    M29: "/home/reference_data/bioinfotree/task/gencode/dataset/mmusculus/M29/GRCm39.primary_assembly.star_index/2.7.11a"

# ========================
# TRIMMING
# ========================

FASTP:
  adapter_r1: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
  adapter_r2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"

TRIM_GALORE:
  PARAM: "" # https://support-docs.illumina.com/SHARE/AdapterSequences/Content/SingleIndexes.htm

# ========================
# COUNTING (FeatureCounts)
# ========================

FEATURECOUNTS_PARAM: "-t exon -g gene_name"
#default count on exons and summarize on gene names, consider -g gene_id
#strandnes and paired-end handled in config.smk
# -O allowMultiOverlap
# -g gene_name
# -s 2
# -p -C ==> paired-end layout

# ========================
# DGE ANALYSIS
# ========================

DGE:
  DGE_TOOL: "edger"
  # FIXED: Added space after colon below
  LIMMA_CONTRASTS: #e.g. LIMMA_CONTRASTS:
        # contrast_name: "contrast"
        # KO_vs_WT: "(KO.ND+KO.HFD)-(WT.ND+WT.HFD)"
  LIMMA_DESIGN_FORMULA: "~0+condition"
  LIMMA_FACTORS: ""
  MIN_NUM_OF_EXPRESSED_SAMPLE: 3
  EXPRESSED_GENES_MIN_CPM: 1
  DGE_CONDITION: "condition"
  LIMMA_CONTRASTS_NAMES: []
MARK_SEQC:
  LOGFC: 1
  PVALUE: 1
  PVALUE_ADJ: 0.05

VENN_CONTRASTS:
  #e.g. TODO better documentation
  #- untreated
  #- vem_4h
  #- vem_24h
  #- res_vem_0.2
  #- res_vem_0.8
  #- res_vem_1.6

HEATMAP:
  COLUMNS: "condition,sh,vem"
  # columns of metadata.txt to add to the heatmap, separated by ,

  N_TOP: "500"
  # number of the top most variant genes to consider for the heatmap

  COLORS: "--pal_set Set3"
  # leave empty if you wish to use the standard colors or specify the custom colorbrewer set to use (default is Set1)

  CLUSTERS: "-r 3 -z 3"
  # indicate the number of clusters the rows (-r) and the columns (-z) will be divided into. 
  # leave empty to have no clusters

# ========================
# VISUALIZATION
# ========================
GFF3_MIN_WINDOW_READS: "100"
BIGWIG_BIN_SIZE: "50"
BEDGRAPH_FILTER: "100"
#REPEAT_FAMILY_RAND_REPETITION=10 

# ========================
# METAGENOMICS (Kraken/Bracken)
# ========================

BRACKEN:
  read_len: 62
  braken_read_len: 100
  braken_min_reads: 5
  braken_level: "S"

kraken_db: "/home/reference_data/bioinfotree/task/kraken/dataset/k2_pluspf_20231009"
kraken_db_nr: "/home/reference_data/bioinfotree/task/kraken/nobackup/k2_nt"
kraken_options: "--minimum-hit-groups 2"
kraken_k2d: "/home/reference_data/bioinfotree/task/kraken/dataset/k2_pluspf_20231009/taxo.k2d"

# ========================
# FEATURE FILTERING
# ========================

feature_filter:
  condition: "disease"
  g1: "D"
  g2: "H"
  use_raw_counts: true
  min_exp: 100
  min_samples_ratio: 0.5

# ========================
# CONTAMINANT / HOST
# ========================

CONTAMINANT_INFO:
  contaminant: ["0000"]
  humanID: ["9606"]
  split_by: ["sample_type"]
  split_by_value: [""]
  multiple_files: FALSE


REFERENCE_DIR: "/home/reference_data/bioinfotree/task/gencode/dataset/hsapiens"
GENOME_ASSEMBLY: "GRCh38.p14"
GENCODE_RELEASE: "46"

GENOME_VERSION: GRCh38.p14

VERSION: "46"

SPECIES: human

UCSC_VERSION: hg38
 
#TODO: unify STAR version in config.yaml and in the rules, currently duplicated
STAR_VERSION: 2.7.11b

STAR_sjdbOverhang: 149

#TODO: put them in the featurecounts section above
# featurecounts param ---
#FEATURECOUNTS_PARAM = config["FEATURECOUNTS_PARAM"] + " -s" + config["STRANDED"]
#if config["LAYOUT"] == "PAIRED":
#    FEATURECOUNTS_PARAM += " -p -C --countReadPairs" 
# -O allowMultiOverlap
#LCPM_PRIOR_COUNT = 0.25           # *standard of edgeR*
#LTPM_PRIOR_COUNT = 0.0001

braken_read_len: 100
braken_min_reads: 5
braken_level: "S"

kraken:
  exclude_classified: True
  include_children: True