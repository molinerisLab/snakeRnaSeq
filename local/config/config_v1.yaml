# GENERAL SETUP ---
TMPDIR: /mnt/nvme_raid0/tmp
CORES: 6
CONDA_ROOT: /opt/conda/miniconda3
DOCKER_DATA_DIR: /home

LAYOUT: PAIRED
#LAYOUT: PAIRED

STRANDED: "2"
#STRANDED: 0|1|2
# 0 -> unstranded
# 1 -> forward
# 2 -> reverse

FEATURECOUNTS_PARAM: -t exon -g gene_name
#default count on exons and summarize on gene names, consider -g gene_id
#strandnes and paired-end handled in config.smk
# -O allowMultiOverlap

FASTQ_FILTERING: fastq

# GENCODE ---
GENCODE:
    SPECIES: hsapiens
    # hsapiens | mmusculus | mmusculus_hsapiens_combined
    VERSION: "37"
    # 32 | M23
    GENOME: GRCh38.primary_assembly
    # GRCh38.primary_assembly | GRCm38.primary_assembly
    ASSEMBLY: GRCh
    ANNOTATION: basic.annotation
    # primary_assembly.annotation | basic.annotation

# TRIMMING ---
FASTP:
    adapter_r1: AGATCGGAAGAGCACACGTCTGAACTCCAGTCA
    adapter_r2: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
TRIM_GALORE:
    PARAM:
# https://support-docs.illumina.com/SHARE/AdapterSequences/Content/SHARE/AdapterSeq/TruSeq/SingleIndexes.htm

# STAR ---
STAR:
    STAR_ADDITIONAL_OUTPUT: "--outFilterType BySJout --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000"
    #--outWigType wiggle --outWigNorm RPM --quantMode TranscriptomeSAM
    STAR_MULTIMAP_SCORE_RANGE: 1       *default = 1*
    STAR_outFilterMultimapNmax: 20     *deafult = 10*
    STAR_FILTER_MISMATCH: "--outFilterMismatchNmax 999 --outFilterMismatchNoverLmax 0.04"     #*default, as used by ENCODE: ammetto il 4% di mismatch sulla lunghezza allineata*
    #STAR_FILTER_MISMATCH: "--outFilterMismatchNmax 14"                                        #*lexogen*
    STAR_OUT_SAM_TYPE: "--outSAMtype BAM SortedByCoordinate "                   #*Unsorted \*
    STAR_SHARED_MEMORY: LoadAndKeep
  #OPTIONS: --outFilterType BySJout --outFilterMultimapNmax 200 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000
  #Questa non so se serve:
  #--chimOutType WithinBAM {config['STAR']['OPTIONS']}"


# DGE ---
DGE:
    DGE_TOOL: edger
  #e.g. DGE_TOOL:=limma|edger|deseq2

    LIMMA_CONTRASTS: 
        - "het_mutant-wt" 
        - "PRPF31-wt" 
        - "SINEUP1-wt" 
        - "undetermined-wt" 
    #e.g. LIMMA_CONTRASTS: 
        #- "(KO.ND+KO.HFD)-(WT.ND+WT.HFD)"
        #- "(WT.HFD+KO.HFD)-(WT.ND+KO.ND)" 
        #- "(WT.HFD-WT.ND)" 
        #- "(KO.HFD-KO.ND)" 
    #e.g. LIMMA_CONTRASTS: "KO-WT"

    LIMMA_CONTRASTS_NAMES: 
        - het_vs_wt
        - PRPF31_rescue_vs_wt 
        - SINEUP1_rescue_vs_wt
        - undeter_vs_wt
  # NB they must follow the same order used in LIMMA_CONTRASTS / LIMMA_DESIGN_FORMULA
  #e.g. LIMMA_CONTRASTS_NAMES:
        #- genotype 
        #- diet 
        #- interaction

    LIMMA_DESIGN_FORMULA: "~0+condition"
  #e.g. LIMMA_DESIGN_FORMULA:="~0+condition"

    LIMMA_FACTORS: " "
  #NB: do not comment LIMMA_FACTORS but leave empty if not required
  #e.g. LIMMA_FACTORS:=-f "genotype treatment"

    MIN_NUM_OF_EXPRESSED_SAMPLE: 4
    EXPRESSED_GENES_MIN_CPM: 1
    DGE_CONDITION: "condition" 

# MARK_SEQC ---
MARK_SEQC:
    LOGFC: 1
    PVALUE: 1
    PVALUE_ADJ: 0.05
