channels:
  - molinerislab
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core Python and utilities
  - python=3.12
  - pip
  - pysam
  - bx-python
  - htslib          
  - zstd
  - pkg-config   

  # Quality control and trimming
  - fastp
  - fastqc
  - multiqc
  - trim-galore
  - rseqc

  # Alignment tools
  - star
  - samtools
  - sambamba

  # Quantification tools
  - subread
  - salmon
  - kallisto
  - stringtie

  # R and packages
  - r-base=4.3
  - r-tidyverse
  - r-optparse
  # Bioconductor packages
  - bioconductor-edger
  - bioconductor-deseq2
  - bioconductor-limma
  - bioconductor-biobase

  # Custom Data Manipulation Tools
  - tabular_data_manipulation
  - symbol_count
  - matrix2tab
  - matrix_reduce
  - filter_1col
  - bawk
  - translate
  - transpose
  - bsort
  - find_best
  - tab2xlsx

  # Alternative splicing analysis
  - pip:
      - spladder
      
