name: snakeRNAseq
channels:
  - conda-forge
  - bioconda
  - molinerislab

dependencies:
  - python=3.12
  - star=2.7.11b
  - subread          
  - multiqc=1.25.2
  - fastqc
  - pandas
  - numpy
  - biopython
  - pip
  - bsort=1.0
  - kraken2=2.1.3
  - bwa=0.7.18
  - krakentools=1.2
  - snakemake
  - samtools
  - bioconda::krona
  - ca-certificates
  - certifi
  - openssl
  - molinerislab::tab2xlsx
  - molinerislab::tabular_data_manipulation
  - conda-forge::biopython
  - bawk
  - matrix_reduce
  - conda-forge::typer
  - dap
  - conda-forge::async